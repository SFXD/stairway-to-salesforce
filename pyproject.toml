[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# This is the package name for pip (can differ from folder name)
name = "dlt-salesforce-advanced"
version = "0.1.0"
description = "Advanced DLT connectors for Salesforce (as source and estination)"
authors = [
    {name = "Bertrand Leymarios", email = "bertrand.leymarios@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "dlt[postgres]>=0.4.0",
    "simple-salesforce>=1.12.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "mock>=5.1.0",
    "freezegun>=1.2.2",
    "faker>=19.3.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]

[tool.setuptools]
# CRITICAL FIX: This must match your actual folder name
packages = ["dlt_salesforce_advanced"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=dlt_salesforce_advanced"