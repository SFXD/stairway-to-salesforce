site_name: Stairway to Salesforce
site_description: ETL Python Framework for Salesforce built on DLT
site_author: SFXD
repo_url: https://github.com/SFXD/stairway-to-salesforce
repo_name: SFXD/stairway-to-salesforce

theme:
  name: material
  language: en
  palette:
    primary: indigo
    accent: light blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

validation:
  links:
    unrecognized_links: ignore

nav:
  - Overview: index.md
  - Quick Start: getting-started.md
  - User Guide:
      - Examples: examples.md
      - Testing: testing.md
      - Architecture: architecture.md
      - Salesforce Authentication: authentication.md
      - DLT: dlt-overview.md
  - API Reference: api-reference.md
  - Community:
      - Contributing: contributing.md
      - Code of Conduct: code-of-conduct.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_source: true
            allow_inspection: false

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.gemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["docs", "."]
  - pymdownx.tabbed:
      alternate_style: true
