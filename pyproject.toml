[project]
name = "stairway-to-salesforce"
version = "0.1.0"
description = "Python ETL for Salesforce extending DLT framework"
authors = [
    {name = "Bertrand Leymarios", email = "bertrand.leymarios@gmail.com"},
    {name = "Geoffrey Bessereau", email = "geoffrey@bessereau.eu"}
]
readme = "readme.md"
requires-python = ">=3.12"
keywords = ["salesforce", "dlt", "etl", "bulk-api", "data-pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "dlt>=0.4.0",
    "simple-salesforce>=1.12.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
postgres  = ["dlt[postgres]>=0.4.0"]
duckdb    = ["dlt[duckdb]>=0.4.0"]
bigquery  = ["dlt[bigquery]>=0.4.0"]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.11.1",
    "mock>=5.1.0",
    "freezegun>=1.2.2",
    "faker>=19.3.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
docs = [
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.3",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stairway_to_salesforce*"]

[tool.pytest.ini_options]
testpaths = ["stairway_to_salesforce/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=stairway_to_salesforce"