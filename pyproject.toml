[project]
name = "stairway-to-salesforce"
version = "0.1.0"
description = "Python ETL for Salesforce extending DLT framework"
authors = [
    {name = "Bertrand Leymarios", email = "bertrand.leymarios@gmail.com"},
    {name = "Geoffrey Bessereau", email = "geoffrey@bessereau.eu"}
]
readme = "readme.md"
requires-python = ">=3.12"
keywords = ["salesforce", "dlt", "etl", "bulk-api", "data-pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "dlt>=0.4.0",
    "simple-salesforce>=1.12.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "cachetools>=5.0.0",
]

[project.optional-dependencies]
postgres = ["dlt[postgres]>=0.4.0"]
duckdb   = ["dlt[duckdb]>=0.4.0"]
bigquery = ["dlt[bigquery]>=0.4.0"]

[dependency-groups]
dev = [
    "ruff>=0.15.6",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.11.1",
    "mock>=5.1.0",
    "freezegun>=1.2.2",
    "faker>=19.3.0",
    "types-cachetools>=6.2.0.20251022",
    "pandas-stubs>=3.0.0.260204",
]
doc = [
    "pymdown-extensions>=10.20.1",
]
docs = [
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-include-markdown-plugin>=7.2.1",    
    "pymdown-extensions>=10.20.1",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["stairway_to_salesforce*"]

[tool.pytest.ini_options]
testpaths = ["stairway_to_salesforce/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=stairway_to_salesforce"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "stairway_to_salesforce/tests", 
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "C90", "B", "E9", "F63", "F7", "F82"]
ignore = ["E203"] 

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/*" = ["S101"]

[tool.ruff.lint.isort]
# Pour correspondre au profil Black que tu avais
force-single-line = false
lines-after-imports = 2
known-first-party = ["stairway_to_salesforce"]

[tool.mypy]
python_version = "3.12"
# On désactive la vérification stricte des fonctions non typées pour l'instant
check_untyped_defs = false 
# On garde les rapports d'erreurs clairs
show_error_codes = true
warn_unused_ignores = true

# Gestion des bibliothèques sans stubs (indispensable)
[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "simple_salesforce.*",
    "dlt.*",
    "faker.*"
]
ignore_missing_imports = true
