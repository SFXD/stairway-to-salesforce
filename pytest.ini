[pytest]
# Add project root to Python path (backup)
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for library code
    integration: Integration tests requiring Salesforce connection
    pipeline: Tests for project-specific pipelines
    slow: Slow running tests
    requires_credentials: Tests requiring Salesforce credentials

# Coverage settings - use correct package name
addopts =
    --verbose
    --strict-markers
    --cov=dlt_salesforce_advanced
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning